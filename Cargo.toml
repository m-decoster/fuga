[package]
name = "fuga"
version = "0.1.0"
description = "A supervisor for multi-process applications"
edition = "2024"
license = "Apache-2.0"

[dependencies]
crossterm = "0.29.0"
ratatui = "0.29.0"
clap = { version = "4.5.49", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.9.8"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
nix = { version = "0.30.1", features = ["process", "signal"] }
textwrap = "0.16.2"
daemonize = "0.5.0"
thiserror = "2.0.17"
