[package]
name = "fuga"
version = "0.1.0"
description = "An orchestrator for multi-process applications"
edition = "2024"
license = "Apache-2.0"

[[bin]]
name = "fugad"
path = "src/bin/daemon/main.rs"

[[bin]]
name = "fugactl"
path = "src/bin/client/main.rs"

[lib]
name = "fuga"
path = "src/lib/lib.rs"

[dependencies]
clap = { version = "4.5.49", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.9.8"
tokio = { version = "1", features = ["full"] }
nix = { version = "0.29", features = ["user", "fs"] }
